<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS — Telegram Mini App</title>
    <!-- Официальная библиотека Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; }
        .card {
            background: rgba(128, 128, 128, 0.1);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            box-sizing: border-box;
            word-break: break-all;
        }
        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>Life OS 🎮</h1>
    <p>Ваша операционная система жизни</p>

    <div class="card" id="user-card">
        <strong>Профиль Telegram:</strong><br>
        <span id="user-info">Загрузка...</span>
    </div>

    <button onclick="testBackendConnection()">Проверить связь с Бэкендом</button>

    <div class="card" id="result-card" style="display:none;">
        <strong>Ответ сервера:</strong><br>
        <pre id="backend-response">Ожидание запроса...</pre>
    </div>

    <script>
        // Инициализация Telegram WebApp SDK
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        const userInfoEl = document.getElementById('user-info');

        if (user) {
            userInfoEl.innerHTML = `Имя: ${user.first_name} ${user.last_name || ''}<br>Username: @${user.username || 'отсутствует'}<br>ID: ${user.id}`;
        } else {
            userInfoEl.innerHTML = "Запущено вне Telegram (в обычном браузере)";
        }

        // ВАЖНО: Замените этот URL на вашу реальную ссылку с Render
        const API_URL = "https://life-os-backend-mthw.onrender.com";

        async function testBackendConnection() {
            const resultCard = document.getElementById('result-card');
            const responseEl = document.getElementById('backend-response');
            
            resultCard.style.display = 'block';
            responseEl.innerText = "Подключаемся к серверу на Render...";

            try {
                // Делаем запрос к эндпоинту /test-db, который мы создали в main.py
                const res = await fetch(`${API_URL}/test-db`);
                const data = await res.json();
                
                // Выводим результат в красивом виде
                responseEl.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                responseEl.innerText = "Ошибка запроса: " + error.message + "\n\n(Убедитесь, что бэкенд на Render проснулся, так как бесплатный тариф засыпает при бездействии).";
            }
        }
    </script>
</body>
</html>
